name: daily-news

# 每天北京时间 07:00 自动抓取文博行业新闻，生成 news.json 并提交回仓库。
# 也可以在 Actions 页面手动点「Run workflow」立即跑一次。

on:
  schedule:
    - cron: "0 23 * * *"   # UTC 23:00 = 北京时间 07:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run crawler
        run: python crawler/crawl.py

      - name: Commit results
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add news.json digest.md crawler/seen.json
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "daily news $(date -u +%F)"
            git push
          fi
